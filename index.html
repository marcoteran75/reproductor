<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Privado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0e1621;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #17212b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .header {
      background-color: #242f3d;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #2aabee, #229ed9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 18px;
    }
    .header-info h3 { font-size: 16px; font-weight: 500; }
    .header-info span { font-size: 13px; color: #8b9bab; }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      aspect-ratio: 16/9;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .content { padding: 20px; }
    .content h2 { font-size: 18px; margin-bottom: 10px; }
    .content p { font-size: 15px; color: #e0e0e0; margin-bottom: 20px; white-space: pre-wrap; }

    .download-section {
      background-color: #1a2733;
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
    }
    .download-section h3 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #2aabee;
    }
    .download-btn {
      display: block;
      background-color: #2aabee;
      color: white;
      text-align: center;
      padding: 13px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .download-btn.secondary {
      background-color: #242f3d;
      border: 1px solid #2b3a4a;
    }
    .footer-note {
      text-align: center;
      padding: 14px;
      font-size: 13px;
      color: #8b9bab;
      border-top: 1px solid #0e1621;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="avatar">V</div>
      <div class="header-info">
        <h3 id="titulo">Título del video</h3>
        <span>milf,</span>
      </div>
    </div>

    <div class="video-wrapper">
      <!-- AQUÍ VA EL IFRAME DE FILEMOON -->
      <iframe 
        id="player"
        src="" 
        allowfullscreen 
        allow="autoplay; fullscreen; encrypted-media"
        scrolling="no">
      </iframe>
    </div>

    <div class="content">
      <h2 id="titulo2">Título del video</h2>
      <p id="descripcion">Descripción del video...</p>

      <div class="download-section">
        <h3>Descargar versión completa</h3>
        <a href="https://tu-enlace-de-pago-1.com" class="download-btn" target="_blank">
          Descargar HD - $X.XX
        </a>
        <a href="https://tu-enlace-de-pago-2.com" class="download-btn secondary" target="_blank">
          Descargar 4K - $X.XX
        </a>
      </div>
    </div>

    <div class="footer-note">
      Video protegido · La descarga gratuita está deshabilitada
    </div>
  </div>

  <script>
    // ========== CONFIGURA AQUÍ ==========
    const config = {
      titulo: "quitandole el novio a la hija",
      descripcion: "Descripción del video.",
      
      // Pon el enlace de embed de Filemoon (el que tiene /e/ o el que te da Filemoon)
      videoUrl: " https://mxdrop.sx/e/nll0m3xvslq418l"
    };

    document.getElementById('titulo').textContent = config.titulo;
    document.getElementById('titulo2').textContent = config.titulo;
    document.getElementById('descripcion').textContent = config.descripcion;

    // Cargar el iframe
    document.getElementById('player').src = config.videoUrl.trim();
  </script>
</body>
</html>
